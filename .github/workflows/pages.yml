name: Pages

# Tests, then deploys. The repository's content, including everything a release
# changes (the changelogs, the package-manager sources, the Chocolatey feed,
# release.json), is committed by the private repository's package workflow
# to a release branch and offered as a pull request; publishing the release
# and merging that pull request is manual and happens together. Merging
# pushes main, which deploys here. Every build renders the update file
# (updates/main.json) from the committed record and the instructions, so a
# changed instruction reaches the site and the app's update notice with the
# next push. The site embeds it and the changelogs, so visitors make no
# GitHub API requests. Nothing else triggers it: no tag, release, or manual run.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The generator and the site's instructions are tested here too: a change
      # to them can reach main without a release.
      - run: node --test package-managers/*.test.mjs scripts/*.test.mjs
      - run: node scripts/build-site.mjs _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
