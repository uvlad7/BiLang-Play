name: Pages

# The site is rebuilt on every public-repository commit or on request for
# testing. Publishing a release also renders its package-manager sources and
# records it (release.json) and deploys that exact tree in this one
# workflow. The bot's source commit uses GITHUB_TOKEN and deliberately does
# not trigger a recursive Pages workflow. Every build renders the update file
# (updates/main.json) from that record and the instructions, so a changed
# instruction reaches the site and the app's update notice with the next
# push. The site embeds it and the changelogs, so visitors make no GitHub API
# requests.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A release event defaults to the release tag. Work from main so a
      # rendered source commit can be pushed and included in this deployment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - run: node --test package-managers/*.test.mjs scripts/*.test.mjs
      - if: github.event_name == 'release' && !github.event.release.draft
        name: Download the exact published install artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          mkdir packages
          for pattern in \
            "bilangplay-${version}-macos-arm64.zip" \
            "bilangplay-${version}-linux-x64.tar.gz" \
            "bilangplay-${version}-windows-x64.zip" \
            "bilangplay-${version}-windows-x64-setup.exe"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir packages --pattern "$pattern"
          done
      - if: github.event_name == 'release' && !github.event.release.draft
        name: Render and commit sources verified against those assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          node package-managers/render.mjs "$version" packages generated
          install -d Casks bucket chocolatey/tools
          cp generated/Casks/bilang-play.rb Casks/
          cp generated/bucket/bilang-play.json bucket/
          cp generated/chocolatey/bilangplay.nuspec chocolatey/
          cp generated/chocolatey/tools/chocolateyinstall.ps1 chocolatey/tools/
          node package-managers/build-chocolatey-feed.mjs "$version" chocolatey chocolatey
          # In the same commit as the sources, so the update notice never
          # offers a version a package manager cannot install yet.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > github-release.json
          node package-managers/updates.mjs github-release.json release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks bucket chocolatey release.json
          if ! git diff --cached --quiet; then
            git commit -m "package-manager sources for ${version}"
            git push origin HEAD:main
          fi
      - run: node scripts/build-site.mjs _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
