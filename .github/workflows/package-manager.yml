name: Package-manager source

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "package-managers/**"
      - ".github/workflows/package-manager.yml"
  push:
    branches: [main]
    paths:
      - "package-managers/**"
      - ".github/workflows/package-manager.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: node --test package-managers/render.test.mjs

  render:
    if: github.event_name == 'release' && !github.event.release.draft
    needs: test
    runs-on: ubuntu-24.04
    steps:
      # A release event checks out the tag by default. Generate on main so the
      # bot can commit the rendered sources back to the branch that Pages uses.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - name: Download the exact published install artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          mkdir packages
          for pattern in \
            "bilangplay-${version}-macos-arm64.zip" \
            "bilangplay-${version}-linux-x64.tar.gz" \
            "bilangplay-${version}-windows-x64.zip" \
            "bilangplay-${version}-windows-x64-setup.exe"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir packages --pattern "$pattern"
          done
      - name: Render and commit sources verified against those assets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          node package-managers/render.mjs "$version" packages generated
          install -d Casks bucket chocolatey/tools
          cp generated/Casks/bilang-play.rb Casks/
          cp generated/bucket/bilang-play.json bucket/
          cp generated/chocolatey/bilangplay.nuspec chocolatey/
          cp generated/chocolatey/tools/chocolateyinstall.ps1 chocolatey/tools/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks bucket chocolatey
          if ! git diff --cached --quiet; then
            git commit -m "package-manager sources for ${version}"
            git push origin HEAD:main
          fi
